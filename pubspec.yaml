name: alquilados_app
description: "Aplicación móvil de gestión de alquileres e inmuebles"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # --- State Management & Dependency Injection ---
  # Riverpod: sistema de estado reactivo tipo-seguro.
  # Equivalente Angular: Services + RxJS Observables
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^3.4.3

  # --- Networking ---
  # Dio: cliente HTTP con interceptors, cancelación, FormData.
  # Equivalente Angular: HttpClient + HttpInterceptor
  dio: ^5.8.0+1

  # --- Navigation ---
  # GoRouter: navegación declarativa con deep linking y redirects.
  # Equivalente Angular: RouterModule + Guards
  go_router: ^18.0.1

  # --- Secure Storage ---
  # Almacenamiento seguro para tokens (Keychain iOS / EncryptedSharedPreferences Android).
  # No existe equivalente directo en Angular (el browser usa cookies/localStorage).
  flutter_secure_storage: ^11.1.1

  # --- Data Classes & Serialization ---
  # Freezed annotations para modelos inmutables con copyWith, ==, hashCode.
  # Equivalente Angular: TypeScript interfaces + readonly, pero generado automáticamente.
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # --- Utilities ---
  # Logger: logging formateado con niveles (debug, info, warning, error).
  logger: ^2.5.0

  # Intl: formateo de fechas, moneda, números en español.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Code Generation ---
  # build_runner: motor que ejecuta los generadores de código (freezed, json, riverpod).
  # Se ejecuta con: dart run build_runner build
  build_runner: ^2.4.15

  # Freezed: genera código para data classes inmutables.
  freezed: ^3.0.0

  # json_serializable: genera fromJson/toJson desde anotaciones.
  json_serializable: ^6.9.5

  # Riverpod generator: genera providers desde @riverpod annotations.
  riverpod_generator: ^3.4.3

  # --- Linting ---
  # riverpod_lint: reglas de lint específicas para Riverpod.
  riverpod_lint: ^3.4.3
  custom_lint: ^0.7.8

  # --- Testing ---
  # mocktail: mocking sin code-gen. Más limpio que mockito.
  mocktail: ^1.1.0

flutter:
  uses-material-design: true

  # Fuentes personalizadas se agregarán aquí en Fase 2
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
